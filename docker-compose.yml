# TLS terminuje Cloudflare, wiec tu nie ma ani certyfikatow, ani portow
# otwartych na swiat.
services:
  telemetry:
    build: .
    restart: unless-stopped
    environment:
      TELEMETRY_TOKEN: ${TELEMETRY_TOKEN:?ustaw TELEMETRY_TOKEN w .env}
    volumes:
      - telemetry-data:/data
    # WYLACZNIE do sprawdzania z hosta (curl 127.0.0.1:8988/healthz).
    # Tunel tego NIE uzywa - idzie siecia composa prosto do telemetry:8988,
    # wiec to mapowanie mozna skasowac i wszystko bedzie dzialac dalej.
    #
    # 127.0.0.1, a nie 0.0.0.0: inaczej serwis wisialby na kazdym interfejsie
    # hosta, czyli takze w sieci lokalnej, z samym tokenem jako ochrona.
    ports:
      - "127.0.0.1:${HOST_PORT:-8988}:8988"

  # Tunel w kontenerze -- tylko dla tych, ktorzy nie maja cloudflared osobno.
  # Startuje wylacznie z jawnym profilem:  docker compose --profile tunnel up -d
  cloudflared:
    profiles: ["tunnel"]
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    # BEZ `:?` -- Compose podstawia zmienne przy wczytywaniu CALEGO pliku,
    # niezaleznie od profili. Z twardym wymogiem samo `docker compose up -d`
    # wywalaloby sie na brak tokenu, mimo ze ten kontener wcale nie wstaje.
    command: tunnel --no-autoupdate run --token ${TUNNEL_TOKEN:-}
    depends_on:
      - telemetry

volumes:
  telemetry-data:
